<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Регистрация</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="components.css" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body>
    <main class="auth">
      <header class="auth__header">
        <h1 class="auth__title">Регистрация</h1>
        <p class="auth__subtitle">Создайте аккаунт</p>
      </header>

      <form class="auth__form" action="#" method="post" novalidate>
        <div class="field">
          <label class="field__label" for="reg-name">Имя</label>
          <input
            class="field__input"
            type="text"
            id="reg-name"
            name="name"
            placeholder="Иван Иванов"
            autocomplete="name"
            required
          />
        </div>

        <div class="field">
          <label class="field__label" for="reg-email">Email</label>
          <input
            class="field__input"
            type="email"
            id="reg-email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="field">
          <label class="field__label" for="reg-password">Пароль</label>
          <input
            class="field__input"
            type="password"
            id="reg-password"
            name="password"
            placeholder="••••••••"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="field">
          <label class="field__label" for="reg-confirm"
            >Подтвердите пароль</label
          >
          <input
            class="field__input"
            type="password"
            id="reg-confirm"
            name="confirm"
            placeholder="••••••••"
            autocomplete="new-password"
            required
          />
        </div>

        <button class="btn btn--primary" type="submit">Создать аккаунт</button>
      </form>

      <footer class="auth__footer">
        Уже есть аккаунт?
        <a class="auth__link" href="authorization.html">Войти</a>
      </footer>
    </main>
  </body>
</html>
